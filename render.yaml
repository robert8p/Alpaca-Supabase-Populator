services:
  - type: web
    name: alpaca-rapid-discovery-web
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: "python --version && python -m pip install --upgrade pip && python -m pip install --only-binary=:all: -r requirements.txt"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: AUTO_MIGRATE
        value: "true"
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: alpaca-rapid-discovery-worker
    runtime: python
    region: frankfurt
    plan: standard
    buildCommand: "python --version && python -m pip install --upgrade pip && python -m pip install --only-binary=:all: -r requirements.txt"
    startCommand: python -m app.worker
    autoDeployTrigger: commit
    disk:
      name: rapid-discovery-staging
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: AUTO_MIGRATE
        value: "false"
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: STAGING_DIR
        value: /var/data/staging
      - key: MAX_GLOBAL_CONCURRENCY
        value: "12"
      - key: WORKER_POLL_SECONDS
        value: "3"
      - key: WORKER_STALE_SECONDS
        value: "180"
      - key: DEFAULT_TARGET_RPM
        value: "9000"
      - key: LOG_LEVEL
        value: INFO
