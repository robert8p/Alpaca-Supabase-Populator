services:
  - type: web
    name: alpaca-rapid-discovery-web
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "python --version && python -m pip install --upgrade pip && python -m pip install --only-binary=:all: -r requirements.txt"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: AUTO_MIGRATE
        value: "true"
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: LOG_LEVEL
        value: INFO
      - key: INTRADAY_PROFITABILITY_RELEASE
        value: "2026-08-20.1"
      - key: OVERSOLD_PRIMARY_EVIDENCE_RELEASE
        value: "2026-08-20.1"
      - key: OVERSOLD_PRIMARY_LOOKBACK_DAYS
        value: "10"
      - key: OVERSOLD_PRIMARY_MAX_SYMBOLS
        value: "120"
      - key: OVERSOLD_PRIMARY_MAX_WORKERS
        value: "4"
      - key: OVERSOLD_PRIMARY_MAX_FILINGS
        value: "4"

  - type: web
    name: alpaca-intraday-profitability
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "python --version && python -m pip install --upgrade pip && python -m pip install --only-binary=:all: -r requirements.txt"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromService:
          type: web
          name: alpaca-rapid-discovery-web
          envVarKey: DATABASE_URL
      - key: ALPACA_API_KEY
        fromService:
          type: web
          name: alpaca-rapid-discovery-web
          envVarKey: ALPACA_API_KEY
      - key: ALPACA_SECRET_KEY
        fromService:
          type: web
          name: alpaca-rapid-discovery-web
          envVarKey: ALPACA_SECRET_KEY
      - key: APP_USERNAME
        fromService:
          type: web
          name: alpaca-rapid-discovery-web
          envVarKey: APP_USERNAME
      - key: APP_PASSWORD
        fromService:
          type: web
          name: alpaca-rapid-discovery-web
          envVarKey: APP_PASSWORD
      - key: AUTO_MIGRATE
        value: "false"
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: LOG_LEVEL
        value: INFO
      - key: INTRADAY_PROFITABILITY_RELEASE
        value: "2026-08-20.1"
      - key: OVERSOLD_PRIMARY_EVIDENCE_RELEASE
        value: "2026-08-20.1"
      - key: OVERSOLD_PRIMARY_LOOKBACK_DAYS
        value: "10"
      - key: OVERSOLD_PRIMARY_MAX_SYMBOLS
        value: "120"
      - key: OVERSOLD_PRIMARY_MAX_WORKERS
        value: "4"
      - key: OVERSOLD_PRIMARY_MAX_FILINGS
        value: "4"

  - type: worker
    name: alpaca-rapid-discovery-worker
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: "python --version && python -m pip install --upgrade pip && python -m pip install --only-binary=:all: -r requirements.txt"
    startCommand: python -m app.worker
    autoDeployTrigger: commit
    disk:
      name: rapid-discovery-staging
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: AUTO_MIGRATE
        value: "false"
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: STAGING_DIR
        value: /var/data/staging
      - key: MAX_GLOBAL_CONCURRENCY
        value: "12"
      - key: WORKER_POLL_SECONDS
        value: "3"
      - key: WORKER_STALE_SECONDS
        value: "180"
      - key: DEFAULT_TARGET_RPM
        value: "9000"
      - key: LOG_LEVEL
        value: INFO
      - key: OVERSOLD_PRIMARY_EVIDENCE_RELEASE
        value: "2026-08-20.1"
      - key: OVERSOLD_PRIMARY_LOOKBACK_DAYS
        value: "10"
      - key: OVERSOLD_PRIMARY_MAX_SYMBOLS
        value: "120"
      - key: OVERSOLD_PRIMARY_MAX_WORKERS
        value: "4"
      - key: OVERSOLD_PRIMARY_MAX_FILINGS
        value: "4"
      - key: OVERSOLD_WORKER_SCAN_ENABLED
        value: "true"
      - key: OVERSOLD_PRIMARY_BOOTSTRAP_ON_START
        value: "true"
