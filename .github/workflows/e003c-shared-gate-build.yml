name: Build shared E003C freeze gate

on:
  push:
    branches:
      - agent/e003c-shared-gate
    paths:
      - .github/workflows/e003c-shared-gate-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/e003c-shared-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add independent shared signal-freeze gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/live_maintenance.py')
          source = path.read_text()
          old_enabled = '''def _enabled() -> bool:\n    return os.getenv("E003C_DAILY_INGEST_ENABLED", "false").strip().lower() in {"1", "true", "yes", "on"}\n'''
          new_enabled = old_enabled + '''\n\ndef _signal_freeze_enabled() -> bool:\n    return os.getenv("E003C_SIGNAL_FREEZE_ENABLED", "true").strip().lower() in {"1", "true", "yes", "on"}\n'''
          assert old_enabled in source
          source = source.replace(old_enabled, new_enabled, 1)

          old_freeze = '''            freeze_result = await asyncio.to_thread(freeze_latest_completed_signal)\n            if freeze_result.get("frozen"):\n                logger.info("E-003C signal freeze created: %s", freeze_result)\n'''
          new_freeze = '''            if _signal_freeze_enabled():\n                freeze_result = await asyncio.to_thread(freeze_latest_completed_signal)\n                if freeze_result.get("frozen"):\n                    logger.info("E-003C signal freeze created: %s", freeze_result)\n'''
          assert old_freeze in source
          source = source.replace(old_freeze, new_freeze, 1)
          path.write_text(source)

          test_path = Path('tests/test_live_maintenance_flags.py')
          test_path.write_text('''from __future__ import annotations\n\nfrom app.live_maintenance import _signal_freeze_enabled\n\n\ndef test_signal_freeze_gate_defaults_enabled(monkeypatch) -> None:\n    monkeypatch.delenv("E003C_SIGNAL_FREEZE_ENABLED", raising=False)\n    assert _signal_freeze_enabled() is True\n\n\ndef test_signal_freeze_gate_can_be_disabled(monkeypatch) -> None:\n    monkeypatch.setenv("E003C_SIGNAL_FREEZE_ENABLED", "false")\n    assert _signal_freeze_enabled() is False\n''')

          Path('.github/workflows/e003c-shared-gate-build.yml').unlink()
          PY
      - name: Validate
        run: |
          python -m pip install -r requirements.txt pytest
          python -m compileall app
          pytest -q tests/test_live_maintenance_flags.py
      - name: Commit prepared cutover gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add independent shared E003C freeze gate"
          git push origin HEAD:agent/e003c-shared-gate
