name: Repair E003C Render identity

on:
  push:
    branches:
      - release/e003c-prospective-20260813

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/e003c-prospective-20260813
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B scripts/repair_e003c_release_pin.py
      - run: |
          python -B -m pip install -r requirements.txt pytest ruff
          ruff check --fix app/e003c_runtime.py tests/test_e003c_runtime.py
          ruff format app/e003c_runtime.py tests/test_e003c_runtime.py
          python -B -m pytest -q tests/test_e003c_runtime.py
          ruff check app/e003c_runtime.py tests/test_e003c_runtime.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Accept absent Render deploy ID under strict identity checks
          branch: release/e003c-prospective-20260813
