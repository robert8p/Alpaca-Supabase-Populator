name: Intraday Profitability production browser gate

on:
  pull_request:
    branches: [main]
    paths:
      - static_intraday/**
      - tests/intraday_production_browser_smoke.js
      - .github/workflows/intraday-production-browser-pr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://alpaca-intraday-profitability-app.onrender.com
      API_URL: https://mnmkxjirpwbptdnvjmpw.supabase.co/functions/v1/intraday-profitability-api
    steps:
      - uses: actions/checkout@v4
      - name: Verify live static assets and API readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 "$SITE_URL/" -o /tmp/index.html
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 "$SITE_URL/app.js" -o /tmp/app.js
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 "$SITE_URL/prompt.js" -o /tmp/prompt.js
          grep -q 'Selected signal tracker' /tmp/index.html
          grep -q 'data-select-candidate' /tmp/app.js
          grep -q "searchParams.set('prompt'" /tmp/prompt.js
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 "$API_URL?action=readiness" | grep -q '"selection_table":true'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise live browser UI
        run: node tests/intraday_production_browser_smoke.js
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-production-browser-smoke
          path: intraday-profitability-production-smoke.png
          if-no-files-found: ignore
          retention-days: 14
