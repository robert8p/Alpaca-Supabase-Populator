name: Repair strict Render identity

on:
  push:
    branches:
      - release/e003c-prospective-20260813
    paths:
      - '.github/workflows/e003c-release-pin-repair-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/e003c-prospective-20260813
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B scripts/repair_e003c_release_pin.py
      - run: |
          python -B -m pip install -r requirements.txt pytest ruff
          ruff check --fix app/e003c_runtime.py tests/test_e003c_runtime.py
          ruff format app/e003c_runtime.py tests/test_e003c_runtime.py
          python -B -m pytest -q tests/test_e003c_runtime.py
          ruff check app/e003c_runtime.py tests/test_e003c_runtime.py
      - run: |
          rm -f .github/workflows/e003c-release-pin-repair-v2.yml .github/workflows/e003c-release-pin-fallback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Accept absent Render deploy ID under strict identity checks'
          git push origin HEAD:release/e003c-prospective-20260813
