name: Intraday Profitability v2 CI

on:
  push:
    branches:
      - feature/intraday-handoff-tracker-heuristic-v2
    paths:
      - app/intraday_profitability_scoring.py
      - app/intraday_profitability_tracking.py
      - app/intraday_profitability_worker.py
      - static_intraday/**
      - supabase/functions/intraday-profitability-api/**
      - tests/test_intraday_profitability_scoring.py
      - tests/test_intraday_profitability_tracking.py
      - tests/test_intraday_prompt_handoff.js
      - docs/intraday_profitability_heuristic_v2.md
      - .github/workflows/intraday-v2-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - app/intraday_profitability_scoring.py
      - app/intraday_profitability_tracking.py
      - app/intraday_profitability_worker.py
      - static_intraday/**
      - supabase/functions/intraday-profitability-api/**
      - tests/test_intraday_profitability_scoring.py
      - tests/test_intraday_profitability_tracking.py
      - tests/test_intraday_prompt_handoff.js
      - docs/intraday_profitability_heuristic_v2.md
      - .github/workflows/intraday-v2-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt pytest

      - name: Run scorer and tracking regression tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          ALPACA_API_KEY: test
          ALPACA_SECRET_KEY: test
          APP_PASSWORD: test
        run: |
          pytest -q tests/test_intraday_profitability_scoring.py tests/test_intraday_profitability_tracking.py
          python -m py_compile app/intraday_profitability_scoring.py app/intraday_profitability_tracking.py app/intraday_profitability_worker.py

      - name: Verify browser JavaScript and populated ChatGPT URL
        run: |
          node --check static_intraday/prompt.js
          node --check static_intraday/app.js
          node tests/test_intraday_prompt_handoff.js
          grep -q 'searchParams.set' static_intraday/prompt.js
          grep -q 'data-select-candidate' static_intraday/app.js
          if grep -Eiq 'api\.openai\.com|OPENAI_API_KEY|ALPACA_(API|SECRET)_KEY|DATABASE_URL|service_role' static_intraday/app.js static_intraday/prompt.js; then
            echo 'A backend secret or prohibited OpenAI API dependency reached the browser bundle.' >&2
            exit 1
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check protected Edge API
        run: |
          cd supabase/functions/intraday-profitability-api
          deno check index.ts
