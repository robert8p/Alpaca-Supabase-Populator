name: oversold-robustness-review
on:
  push:
    branches: [fix/oversold-robustness-v39]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare isolated regression dependencies
        run: |
          python -m pip download --only-binary=:all: -r requirements-dev.txt -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: oversold-test-wheels
          path: wheels/
          retention-days: 1
