name: calibration-repair-evidence
on:
  push:
    branches: [fix/reversion-calibration-20260907]
    paths: [.github/workflows/calibration-repair-evidence.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          cache: pip
      - name: Decode and checksum the reviewed patch
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          parts = ''.join(Path(f'.release/calibration-repair-{i}.b64').read_text().strip() for i in range(3))
          patch = gzip.decompress(base64.b64decode(parts, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '392e728fa3e0b9367932dddfb4add5a929d8b1729acb5929c13a06fd26bde3bc', 'Patch checksum mismatch'
          Path('/tmp/calibration-repair.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/calibration-repair.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/calibration-repair.patch'], check=True)
          subprocess.run(['git', 'diff', '--stat'], check=True)
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile and check every production JavaScript file
        run: |
          python -m compileall -q app tests
          find app/static -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Full regression suite including calibration repair tests
        run: |
          mkdir -p calibration-evidence
          python -m pytest -q --junitxml=calibration-evidence/junit.xml | tee calibration-evidence/pytest.txt
      - name: Preserve exact tested source
        if: always()
        run: |
          mkdir -p calibration-evidence
          cp /tmp/calibration-repair.patch calibration-evidence/ || true
          python - <<'PY'
          import subprocess, zipfile
          from pathlib import Path
          paths = subprocess.check_output(['git','ls-files','--cached','--others','--exclude-standard'], text=True).splitlines()
          with zipfile.ZipFile('calibration-evidence/tested-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for path in sorted(set(paths)):
                  if Path(path).is_file() and not path.startswith('calibration-evidence/'):
                      z.write(path)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-repair-tested
          path: calibration-evidence/
          retention-days: 5
      - name: Commit only application changes to the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore .github/workflows/release-gate.yml
          git add app tests sql CALIBRATION_REPAIR.md
          git rm .release/calibration-repair-0.b64 .release/calibration-repair-1.b64 .release/calibration-repair-2.b64
          git commit -m 'Fix reversion calibration processing, readiness reporting and shared status UI'
          git push origin HEAD:fix/reversion-calibration-20260907
