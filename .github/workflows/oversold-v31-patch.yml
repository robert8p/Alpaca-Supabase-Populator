name: oversold-v31-patch

on:
  push:
    branches:
      - agent/oversold-score-v3-hardening
    paths:
      - .github/workflows/oversold-v31-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oversold-score-v3-hardening
      - name: Apply targeted hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          scoring = Path('app/oversold_scoring.py')
          text = scoring.read_text()
          text = text.replace(
              'from app.oversold_live_enrichment import load_runtime_enrichment\n',
              'from app.oversold_live_enrichment import load_runtime_enrichment\n'
              'from app.oversold_v3_hardening import (\n'
              '    apply_quantified_event_hardening, direct_news_risk_flags, filter_causal_articles,\n'
              '    setup_post_spike_cap,\n'
              ')\n',
              1,
          )
          text = text.replace('SCORING_MODEL_VERSION = "oversold_reversion_score_v3"', 'SCORING_MODEL_VERSION = "oversold_reversion_score_v3_1"', 1)
          text = text.replace('SCORING_CONFIG_VERSION = "or_score_config_2026_08_20_v1"', 'SCORING_CONFIG_VERSION = "or_score_config_2026_08_20_v2"', 1)
          text = text.replace('CATALYST_PROMPT_VERSION = "catalyst_rules_prompt_v2"', 'CATALYST_PROMPT_VERSION = "catalyst_rules_prompt_v3"', 1)
          text = text.replace('CATALYST_SCHEMA_VERSION = "catalyst_schema_v2"', 'CATALYST_SCHEMA_VERSION = "catalyst_schema_v3"', 1)

          old_setup = '''    weights = SCORING_CONFIG["setup_feature_weights"]\n    score = sum(components[key] * float(weights[key]) for key in weights)\n    return round(clamp(score), 1), {\n        "component_scores": {key: round(value, 1) for key, value in components.items()},\n        "weights": weights,\n        "technical_features": tech,\n        "liquidity_score": round(liquidity, 1),\n        "spread_quality_score": round(spread, 1),\n        "dislocation_strength": round(_dislocation_strength(tech, _number(candidate.get("drop_pct"))), 1),\n    }\n'''
          new_setup = '''    weights = SCORING_CONFIG["setup_feature_weights"]\n    raw_score = sum(components[key] * float(weights[key]) for key in weights)\n    setup_cap, setup_cap_reasons = setup_post_spike_cap(tech)\n    score = min(raw_score, setup_cap)\n    return round(clamp(score), 1), {\n        "component_scores": {key: round(value, 1) for key, value in components.items()},\n        "weights": weights,\n        "technical_features": tech,\n        "liquidity_score": round(liquidity, 1),\n        "spread_quality_score": round(spread, 1),\n        "raw_setup_score": round(clamp(raw_score), 1),\n        "setup_cap": round(setup_cap, 1),\n        "setup_cap_reasons": setup_cap_reasons,\n        "dislocation_strength": round(_dislocation_strength(tech, _number(candidate.get("drop_pct"))), 1),\n    }\n'''
          if old_setup not in text:
              raise SystemExit('setup scoring block not found')
          text = text.replace(old_setup, new_setup, 1)

          old_start = '''    text = _article_text(articles)\n    sector_hint = infer_sector_hint(articles)\n    signals = _event_signals(text, risk_flags, sector_hint)\n    profile = _event_profile(signals, catalyst_class)\n    recognised_signals = [name for name, value in signals.items() if value and name not in {"analyst_action", "analyst_target_cut", "analyst_target_raise", "primary_endpoint_success", "guidance_reaffirmed"}]\n    cause_recognised = bool(recognised_signals) or signals["analyst_only"] or signals["guidance_reaffirmed"]\n    has_news = bool(articles)\n'''
          new_start = '''    causal_articles, news_relevance_trace = filter_causal_articles(candidate, articles)\n    text = _article_text(causal_articles)\n    sector_hint = infer_sector_hint(causal_articles)\n    filing_risk_flags = list((fundamentals or {}).get("derived_risk_flags") or [])\n    effective_risk_flags = sorted(set(filing_risk_flags + direct_news_risk_flags(text)))\n    signals = _event_signals(text, effective_risk_flags, sector_hint)\n    profile = _event_profile(signals, catalyst_class if causal_articles else "U")\n    profile, event_metrics, quantitative_adjustments = apply_quantified_event_hardening(\n        signals=signals, profile=profile, text=text, tech=tech\n    )\n    recognised_signals = [name for name, value in signals.items() if value and name not in {"analyst_action", "analyst_target_cut", "analyst_target_raise", "primary_endpoint_success", "guidance_reaffirmed"}]\n    custom_cause = bool(event_metrics.get("quantitative_earnings_event") or event_metrics.get("control_transaction") or event_metrics.get("post_spike_context"))\n    cause_recognised = bool(recognised_signals) or signals["analyst_only"] or signals["guidance_reaffirmed"] or custom_cause\n    has_news = bool(causal_articles)\n'''
          if old_start not in text:
              raise SystemExit('structured catalyst start block not found')
          text = text.replace(old_start, new_start, 1)
          text = text.replace('_fundamental_resilience(fundamentals, signals, risk_flags)', '_fundamental_resilience(fundamentals, signals, effective_risk_flags)', 1)
          text = text.replace('if "clinical_regulatory" in risk_flags and sector_hint == "biotechnology"', 'if "clinical_regulatory" in effective_risk_flags and sector_hint == "biotechnology"', 1)
          text = text.replace('if "dilution" in risk_flags:\n        event_damage', 'if "dilution" in effective_risk_flags:\n        event_damage', 1)
          text = text.replace('if "solvency" in risk_flags:\n        event_damage', 'if "solvency" in effective_risk_flags:\n        event_damage', 1)
          text = text.replace('_source_evidence_quality(candidate, articles, cause_recognised=cause_recognised, conflicting=conflicting)', '_source_evidence_quality(candidate, causal_articles, cause_recognised=cause_recognised, conflicting=conflicting)', 1)
          text = text.replace('    if not articles:\n        contradictory.append("No company-specific news evidence was retained at the signal cutoff; causal attribution is weak.")', '    if not causal_articles:\n        contradictory.append("No ticker-specific causal article survived the relevance filter at the signal cutoff; causal attribution is weak.")', 1)
          text = text.replace('analyst_articles = [article for article in articles if _contains_any', 'analyst_articles = [article for article in causal_articles if _contains_any', 1)
          text = text.replace('primary = articles[0].get("headline") if articles else "No independently retained company-specific news at the signal cutoff"', 'primary = causal_articles[0].get("headline") if causal_articles else "No independently verified ticker-specific catalyst at the signal cutoff"', 1)
          text = text.replace('"red_flags": sorted(set(risk_flags)),', '"red_flags": sorted(set(effective_risk_flags)),', 1)
          text = text.replace('"source_claims": _evidence_items(articles),', '"source_claims": _evidence_items(causal_articles),\n        "news_relevance_trace": news_relevance_trace,\n        "event_metrics": event_metrics,\n        "quantitative_adjustments": quantitative_adjustments,', 1)

          old_sector = '    sector_hint = infer_sector_hint(articles)\n    enrichment = load_runtime_enrichment(candidate, sector_hint)\n'
          new_sector = '    causal_for_sector, _ = filter_causal_articles(candidate, articles)\n    sector_hint = infer_sector_hint(causal_for_sector)\n    enrichment = load_runtime_enrichment(candidate, sector_hint)\n'
          if old_sector not in text:
              raise SystemExit('score candidate sector block not found')
          text = text.replace(old_sector, new_sector, 1)
          text = text.replace('    if not articles:\n        missing_inputs.append("company_specific_news")', '    if not articles:\n        missing_inputs.append("company_specific_news")\n    if not analysis.get("news_relevance_trace", {}).get("causal_article_count"):\n        missing_inputs.append("verified_ticker_specific_catalyst")', 1)
          scoring.write_text(text)

          oversold = Path('app/oversold.py')
          text = oversold.read_text()
          text = text.replace(
              'from app.oversold_scoring import MODEL_STATUS, SCORING_CONFIG_VERSION, SCORING_MODEL_VERSION, TARGET_DEFINITION, score_candidate\n',
              'from app.oversold_scoring import MODEL_STATUS, SCORING_CONFIG_VERSION, SCORING_MODEL_VERSION, TARGET_DEFINITION, score_candidate\n'
              'from app.oversold_v3_hardening import classify_news_for_candidate\n',
              1,
          )
          text = text.replace(
              'r"\\b(etf|exchange[- ]traded fund|warrants?|rights?|units?|preferred|proshares|direxion|tradr|leverage shares|t-rex|defiance|graniteshares|yieldmax|roundhill|rex shares)\\b",',
              'r"\\b(etf|etn|exchange[- ]traded fund|exchange[- ]traded note|warrants?|rights?|units?|preferred|inverse|leveraged|microsectors|proshares|direxion|tradr|leverage shares|t-rex|defiance|graniteshares|yieldmax|roundhill|rex shares)\\b",',
              1,
          )
          count = text.count('catalyst_class, catalyst_summary, risk_flags = _classify_news(articles)')
          if count != 1:
              raise SystemExit(f'expected one _classify_news scan call, found {count}')
          text = text.replace(
              'catalyst_class, catalyst_summary, risk_flags = _classify_news(articles)',
              'catalyst_class, catalyst_summary, risk_flags = classify_news_for_candidate(item, articles)',
              1,
          )
          oversold.write_text(text)
          PY
          git config user.name "oversold-v31-bot"
          git config user.email "oversold-v31-bot@users.noreply.github.com"
          git add app/oversold.py app/oversold_scoring.py
          git commit -m "Harden Score v3 causal evidence and post-spike handling"
          git push origin HEAD:agent/oversold-score-v3-hardening
