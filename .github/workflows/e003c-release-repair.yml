name: Repair E003C release candidate

on:
  push:
    branches:
      - release/e003c-prospective-20260813
    paths:
      - .github/workflows/e003c-release-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/e003c-prospective-20260813
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic release repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          migration_path = Path('sql/migrations/20260813_e003c_runtime_isolation.sql')
          migration = migration_path.read_text()
          assert migration.count('TRIGGGER') == 3, 'unexpected migration typo count'
          migration_path.write_text(migration.replace('TRIGGGER', 'TRIGGER'))

          worker_path = Path('app/e003c_worker.py')
          worker = worker_path.read_text()
          worker = worker.replace('from app.live_maintenance import queue_safe_missing_days\n', '')
          old_helper = '''def _maintenance_enabled() -> bool:\n    return os.getenv("E003C_DEDICATED_MAINTENANCE_ENABLED", "true").strip().lower() in {"1", "true", "yes", "on"}\n'''
          new_helper = '''def _signal_freeze_enabled() -> bool:\n    return os.getenv("E003C_SIGNAL_FREEZE_ENABLED", "true").strip().lower() in {"1", "true", "yes", "on"}\n'''
          assert old_helper in worker, 'maintenance helper not found'
          worker = worker.replace(old_helper, new_helper)
          replacement = '''async def _signal_freeze_scheduler(\n    identity: RuntimeIdentity,\n    lock: AdvisoryWriterLock,\n    local_stop_event: asyncio.Event,\n) -> None:\n    if not _signal_freeze_enabled():\n        return\n    logger.info("Dedicated E003C signal-freeze scheduler enabled")\n    while not local_stop_event.is_set():\n        try:\n            await asyncio.to_thread(assert_writer_authority, identity, lock)\n            freeze_result = await asyncio.to_thread(freeze_latest_completed_signal)\n            if freeze_result.get("frozen"):\n                logger.info("Dedicated E003C signal freeze created: %s", freeze_result)\n        except asyncio.CancelledError:\n            raise\n        except Exception:\n            logger.exception("Dedicated E003C signal-freeze scheduler error")\n        try:\n            poll_seconds = _seconds("E003C_SIGNAL_FREEZE_POLL_SECONDS", 900.0, 300.0, 3600.0)\n            await asyncio.wait_for(local_stop_event.wait(), timeout=poll_seconds)\n        except TimeoutError:\n            pass\n'''
          worker, count = re.subn(
              r'async def _maintenance_scheduler\([\s\S]*?\n\nasync def _heartbeat_loop',
              replacement + '\n\nasync def _heartbeat_loop',
              worker,
              count=1,
          )
          assert count == 1, 'maintenance scheduler block not replaced'
          old_task = 'asyncio.create_task(_maintenance_scheduler(identity, lock, stop_event), name="e003c-dedicated-maintenance"),'
          new_task = 'asyncio.create_task(_signal_freeze_scheduler(identity, lock, stop_event), name="e003c-dedicated-signal-freeze"),'
          assert old_task in worker, 'maintenance task not found'
          worker = worker.replace(old_task, new_task)
          assert 'queue_safe_missing_days' not in worker
          assert 'app.live_maintenance' not in worker
          worker_path.write_text(worker)

          runtime_path = Path('app/e003c_runtime.py')
          runtime = runtime_path.read_text()
          old_type = 'service_type_ok = identity.service_type == "worker"'
          new_type = 'service_type_ok = identity.service_type in {"worker", "background_worker"}'
          assert old_type in runtime, 'service-type gate not found'
          runtime_path.write_text(runtime.replace(old_type, new_type))

          render_path = Path('render/e003c-prospective-worker.yaml')
          render = render_path.read_text()
          render = render.replace('E003C_DEDICATED_MAINTENANCE_ENABLED', 'E003C_SIGNAL_FREEZE_ENABLED')
          render = render.replace('E003C_MAINTENANCE_POLL_SECONDS', 'E003C_SIGNAL_FREEZE_POLL_SECONDS')
          render_path.write_text(render)

          tests_path = Path('tests/test_e003c_runtime.py')
          tests = tests_path.read_text()
          tests += '''\n\ndef test_release_pin_accepts_render_background_worker_type() -> None:\n    sha = "c" * 40\n    identity = RuntimeIdentity(\n        owner_id="owner",\n        service_id="srv-test",\n        service_name="e003c",\n        service_type="background_worker",\n        deployment_id="dep-test",\n        instance_id="instance",\n        git_sha=sha,\n        git_branch="release/e003c-prospective-20260813",\n        repo_slug="robert8p/Alpaca-Supabase-Populator",\n        release_sha=sha,\n        expected_branch="release/e003c-prospective-20260813",\n        expected_service_name="e003c",\n        expected_service_id="srv-test",\n    )\n    assert release_pin_readiness(identity)["ok"] is True\n\n\ndef test_dedicated_worker_excludes_generic_rapid_maintenance() -> None:\n    worker_source = (Path(__file__).resolve().parents[1] / "app" / "e003c_worker.py").read_text()\n    assert "queue_safe_missing_days" not in worker_source\n    assert "app.live_maintenance" not in worker_source\n'''
          tests = tests.replace('from datetime import date, datetime\n', 'from datetime import date, datetime\nfrom pathlib import Path\n', 1)
          tests_path.write_text(tests)

          workflow_path = Path('.github/workflows/e003c-release-repair.yml')
          workflow_path.unlink()
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Format, validate and constrain repaired release
        run: |
          ruff check --fix app/e003c_runtime.py app/e003c_worker.py tests/test_e003c_runtime.py
          ruff format app/e003c_runtime.py app/e003c_worker.py tests/test_e003c_runtime.py
          python -m compileall app
          pytest -q tests/test_e003c_runtime.py
          ruff check app/e003c_runtime.py app/e003c_worker.py tests/test_e003c_runtime.py
          ! grep -R "TRIGGGER\|queue_safe_missing_days\|app.live_maintenance" app/e003c_worker.py sql/migrations/20260813_e003c_runtime_isolation.sql
      - name: Commit repaired release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair and constrain E003C isolation release"
          git push origin HEAD:release/e003c-prospective-20260813
