name: release-gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app tests
      - name: JavaScript syntax
        run: |
          node --check app/static/oversold_score_ui.js
          node --check app/static/oversold_chatgpt_score.js
          node --check app/static/oversold_top5.js
          node --check app/static/oversold_tracking_v3.js
          node --check app/static/oversold_v2.js
          node --check app/static/intraday_profitability.js
          node --check app/static/oversold_v33_ui.js
          node --check app/static/oversold_chatgpt_v33.js
          node --check app/static/oversold_v33_explainability.js
          node --check app/static/oversold_primary_evidence_ui.js
          node --check app/static/oversold_v34_reliability_ui.js
          node --check app/static/oversold_chatgpt_v34.js
      - name: Unit tests
        run: pytest -q
